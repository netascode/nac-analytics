name: Release

on:
  push:
    tags:
      - "v*"

jobs:
  test:
    uses: ./.github/workflows/test.yml

  build:
    needs: test
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          persist-credentials: false

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: true

      - name: Build packages
        run: uv build

      - name: Smoke test wheel
        run: |
          uv venv .pkg-test
          uv pip install --python .pkg-test dist/*.whl
          .pkg-test/bin/nac-analytics version
          .pkg-test/bin/nac-analytics --help
          uv pip install --python .pkg-test pytest httpx pyyaml python-dotenv
          .pkg-test/bin/python -m pytest tests/unit/test_cli.py tests/contract/ -q

      - name: Upload distributions
        uses: actions/upload-artifact@v7
        with:
          name: dist
          path: dist/

  publish:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      id-token: write
    steps:
      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          enable-cache: false

      - name: Download distributions
        uses: actions/download-artifact@v7
        with:
          name: dist
          path: dist/

      - name: Publish to PyPI
        run: uv publish
